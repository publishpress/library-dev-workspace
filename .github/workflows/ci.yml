name: CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression_tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up PHP
        # 2.37.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "7.4"
          coverage: none

      - name: Check PHP syntax
        run: |
          php -l scripts/plugin-bump-version.php
          php -l test/plugin-bump-version-test.php

      - name: Run PHP fixture tests
        run: php test/plugin-bump-version-test.php

      - name: Check shell syntax
        run: |
          bash -n scripts/plugin-version.sh
          bash -n scripts/check-release.sh
          bash -n scripts/check-wporg.sh
          bash -n scripts/translate-pot.sh
          bash -n test/plugin-version-test.sh
          bash -n test/lint-phpcs-test.sh
          bash -n test/translate-pot-test.sh

      - name: Run shell fixture tests
        run: |
          bash test/plugin-version-test.sh
          bash test/lint-phpcs-test.sh
          bash test/translate-pot-test.sh
